name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh headlines]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. Each run checks out the latest main after it starts,
# including the edition committed by a completed refresh.
concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    env:
      SITE_URL: https://tab.jonlo.xyz
      SITE_BASE_PATH: /
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Install OG renderer
        run: npx playwright install --with-deps chromium
      - name: Build static site, generate and validate OG image
        run: npm run build
      - name: Install the Pages artifact checker
        working-directory: .github/actions/wait-for-pages-artifact
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Upload complete site including generated og.png
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Wait for the Pages artifact to be visible
        uses: ./.github/actions/wait-for-pages-artifact
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
