name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh daily edition]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments. Each run checks out the latest main after it starts,
# including the edition committed by a completed refresh.
concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: withastro/action@v5
        with:
          node-version: 22.23.4
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
