name: Refresh headlines

on:
  schedule:
    # Run away from the top of the hour to reduce schedule delays or dropped runs.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-edition
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
      - run: npm run collect
      - name: Commit the latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/editions/
          if git diff --cached --quiet; then
            echo "No edition changes to commit."
          else
            git commit -m "Refresh headlines"
            git pull --rebase origin main
            git push
          fi
